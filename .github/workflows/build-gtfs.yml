name: Build provisional RíoBus GTFS
on:
  workflow_dispatch:
  push:
    paths:
      - 'data/riobus-osm.json'
      - 'scripts/build_gtfs.py'
      - 'requirements.txt'
      - '.github/workflows/build-gtfs.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Generate provisional feed
        run: python scripts/build_gtfs.py 2026-11-06 2027-11-05
      - name: Inspect generated feed
        run: |
          python - <<'PY'
          import csv, io, zipfile
          path='dist/gtfs-barranquilla-riobus.zip'
          with zipfile.ZipFile(path) as z:
              names=set(z.namelist())
              assert {'agency.txt','routes.txt','stops.txt','trips.txt','stop_times.txt','calendar.txt','calendar_dates.txt','shapes.txt','feed_info.txt'} <= names
              for name in names:
                  rows=list(csv.DictReader(io.StringIO(z.read(name).decode())))
                  print(name, len(rows))
                  assert rows or name=='calendar_dates.txt'
          PY
      - name: Set up Java for MobilityData Validator
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download verified MobilityData GTFS Validator 8.0.1
        run: |
          curl --fail --location --retry 3 --output gtfs-validator-cli.jar \
            https://github.com/MobilityData/gtfs-validator/releases/download/v8.0.1/gtfs-validator-8.0.1-cli.jar
          echo "19293ddd9b6f954f216d4f12054bd8a3232921751c4484339e339764a91000e2  gtfs-validator-cli.jar" | sha256sum --check
      - name: Validate GTFS with MobilityData
        run: |
          mkdir -p validation
          java -jar gtfs-validator-cli.jar -i dist/gtfs-barranquilla-riobus.zip -o validation
      - name: Upload MobilityData validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: riobus-gtfs-validation-report
          path: validation/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: provisional-riobus-gtfs
          path: dist/gtfs-barranquilla-riobus.zip
